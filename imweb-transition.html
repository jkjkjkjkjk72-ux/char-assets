<!-- 아임웹 사이트 전체 스크립트(헤더 코드 삽입)에 붙여넣기 -->

<style>
  .fade-up, .reveal, .stagger > * { will-change: transform, opacity; }
  .fade-up, .stagger > * { opacity: 0; }
  .reveal { clip-path: inset(0 0 100% 0); }
  .reveal img { transform: scale(1.12); }

  @media (prefers-reduced-motion: reduce) {
    .fade-up, .reveal, .stagger > * { opacity: 1 !important; clip-path: none !important; }
    .reveal img { transform: none !important; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  function init() {
    if (!window.gsap || !window.ScrollTrigger) return setTimeout(init, 100);
    gsap.registerPlugin(ScrollTrigger);

    /* ══════════ 타이밍 — 이 값으로 전체 톤이 정해집니다 ══════════ */
    var D_TEXT  = 1.2;      // 텍스트 등장 시간(초)
    var D_IMG   = 1.6;      // 이미지 등장 시간(초)
    var EASE    = 'expo.out';
    var STAGGER = 0.1;      // 순차 등장 간격(초)
    var START   = 'top 80%';
    /* ═════════════════════════════════════════════════════════ */

    var common = { scrollTrigger: null, ease: EASE, overwrite: 'auto' };

    // 1. 페이드 업 — 아래에서 올라오며 나타남
    gsap.utils.toArray('.fade-up').forEach(function (el) {
      gsap.fromTo(el,
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: D_TEXT, ease: EASE,
          scrollTrigger: { trigger: el, start: START, once: true } }
      );
    });

    // 2. 이미지 리빌 — 커튼 걷기 + 미세 축소
    gsap.utils.toArray('.reveal').forEach(function (el) {
      var img = el.querySelector('img') || el;
      var tl = gsap.timeline({
        scrollTrigger: { trigger: el, start: START, once: true }
      });
      tl.fromTo(el,
        { clipPath: 'inset(0 0 100% 0)' },
        { clipPath: 'inset(0 0 0% 0)', duration: D_IMG, ease: EASE }, 0);
      tl.fromTo(img,
        { scale: 1.12 },
        { scale: 1, duration: D_IMG, ease: EASE }, 0);
    });

    // 3. 순차 등장 — 자식 요소를 0.1초씩 늦게
    gsap.utils.toArray('.stagger').forEach(function (el) {
      gsap.fromTo(el.children,
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: D_TEXT, ease: EASE, stagger: STAGGER,
          scrollTrigger: { trigger: el, start: START, once: true } }
      );
    });

    ScrollTrigger.refresh();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 아임웹이 콘텐츠를 나중에 그리는 경우 대비
  window.addEventListener('load', function () {
    if (window.ScrollTrigger) ScrollTrigger.refresh();
  });
})();
</script>
